[package]
name = "build-script"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/build-script/build"

[dependencies]
base64 = "0.23.1"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
lzma-rust2 = { version = "0.24.0", default-features = false, features = ["optimization", "std", "xz"] }
object = { version = "0.40.0", default-features = false, features = ["read_core", "coff", "std"] }
quick-xml = { version = "0.42.0", features = ["serialize", "overlapped-lists"] }
regex-lite = "0.1.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
tar = { version = "0.4.46", default-features = false }
ureq = { version = "3.5.0", default-features = false, features = ["platform-verifier", "rustls"] }
zip = { version = "9.2.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustls-native-certs = "0.8.5"

[dev-dependencies]
object = { version = "0.40.0", default-features = false, features = ["read_core", "coff", "std", "write_std"] }
