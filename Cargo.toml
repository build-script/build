[package]
name = "build-script"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
quick-xml = { version = "0.42.0", features = ["serialize", "overlapped-lists"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
ureq = { version = "3.5.0", default-features = false, features = ["platform-verifier", "rustls"] }
